<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="一款支持三档 AI 难度、键盘操作与移动端体验的单机海战棋游戏。"
    />
    <meta name="theme-color" content="#BCCDD3" />
    <script>
      (function applyInitialTheme() {
        var saved = window.localStorage.getItem("battleship.theme");
        var preference = ["auto", "day", "night"].includes(saved) ? saved : "auto";
        var resolved = preference === "auto"
          ? window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day"
          : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
        document.querySelector('meta[name="theme-color"]').content = resolved === "night" ? "#161616" : "#BCCDD3";
      })();
    </script>
    <title>海战棋 · 单机战术对决</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2324353c'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%2386afc2' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%2386afc2'/%3E%3Cpath d='M32 7v9M32 48v9M7 32h9M48 32h9' stroke='%23eeece5' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css?v=20260816-10" />
  </head>
  <body>
    <div id="game-root" class="game-root">
      <header class="command-bar">
        <a class="brand" href="./" aria-label="重新载入海战棋">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="12"></circle>
            <circle cx="16" cy="16" r="4"></circle>
            <path d="M16 1.5v7M16 23.5v7M1.5 16h7M23.5 16h7"></path>
          </svg>
          <span>海战棋</span>
        </a>

        <div class="turn-indicator" data-role="turn-indicator">
          <span class="turn-dot" aria-hidden="true"></span>
          <span data-role="phase-label">布阵阶段</span>
        </div>

        <div class="command-meta">
          <div class="timer" aria-label="对局计时">
            <svg class="timer-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 6.5v6l4 2"></path>
            </svg>
            <strong data-role="timer">00:00</strong>
          </div>

          <label class="difficulty-control">
            <span>AI</span>
            <select data-role="difficulty-select" aria-label="选择 AI 难度">
              <option value="easy">简单</option>
              <option value="medium" selected>普通</option>
              <option value="hard">困难</option>
            </select>
          </label>

          <label class="theme-control">
            <span>主题</span>
            <select data-role="theme-select" aria-label="选择显示主题">
              <option value="auto">自动</option>
              <option value="day">白天</option>
              <option value="night">夜晚</option>
            </select>
          </label>

          <button
            class="icon-button"
            type="button"
            data-action="toggle-sound"
            data-focus-key="toggle-sound"
            aria-label="关闭声音"
            aria-pressed="true"
          >
            <svg class="sound-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path class="sound-body" d="M4 9h4l5-4v14l-5-4H4z"></path>
              <path class="sound-wave" d="M16 8.3a5 5 0 0 1 0 7.4M18.6 5.8a8.5 8.5 0 0 1 0 12.4"></path>
              <path class="sound-muted" d="m16 9 5 6m0-6-5 6"></path>
            </svg>
          </button>

          <button
            class="icon-button rules-button"
            type="button"
            data-action="open-rules"
            data-focus-key="open-rules"
            aria-label="查看规则"
          >
            <svg class="help-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M9.7 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1.2.9-1.2 1.7M12 16.8v.2"></path>
            </svg>
            <span class="button-label">规则</span>
          </button>

          <button
            class="secondary-button restart-button"
            type="button"
            data-action="request-restart"
            data-focus-key="request-restart"
          >
            <svg class="restart-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.2 5.5"></path>
              <path d="M20 5v6h-6"></path>
            </svg>
            <span>重新开始</span>
          </button>
        </div>
      </header>

      <main id="app" class="game-app"></main>

      <footer class="status-bar">
        <span class="status-target" aria-hidden="true"></span>
        <strong>提示</strong>
        <span data-role="status-message">选择舰船并完成布阵。</span>
      </footer>
    </div>

    <div id="modal-root"></div>
    <div
      id="live-region"
      class="visually-hidden"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <script type="module" src="./app.js?v=20260816-10"></script>
  </body>
</html>
